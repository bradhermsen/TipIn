name: Deploy NetFront API Dev

on:
  push:
    branches:
      - main
    paths:
      - api/NetFrontAPI/**
      - .github/workflows/deploy-netfront-api-dev.yml
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: api/NetFrontAPI/NetFrontAPI.csproj
  PUBLISH_DIR: api/NetFrontAPI/publish
  FUNCTIONAPP_NAME: netfront-api-dev

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
