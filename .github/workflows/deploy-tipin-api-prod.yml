name: Deploy TipIn API Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY_PRODUCTION to deploy the production API
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_PRODUCTION

permissions:
  id-token: write
  contents: read

concurrency:
  group: tipin-api-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: api/TipInAPI/TipInAPI.csproj
  FUNCTIONAPP_NAME: func-tipin-api-prod-cus-01
  AZURE_CLIENT_ID: e8f777f6-c14d-4037-ae7e-6d9c12695ff3
  AZURE_TENANT_ID: 42da914a-4f59-4b27-9146-44aa32e46587
  AZURE_SUBSCRIPTION_ID: 22eed768-4fc5-4709-93f6-c31b3205a73b

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: test "$CONFIRMATION" = "DEPLOY_PRODUCTION"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ runner.temp }}/tipin-api-prod --no-build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/tipin-api-prod