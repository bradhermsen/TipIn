<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scoreboard Debug</title>
    <style>
      :root {
        --bg: #0b1020;
        --card-bg: #141a33;
        --card-border: #1f274a;
        --accent: #ff8c32;
        --cyan: #38bdf8;
        --text: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }

      .nav-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        background: var(--card-bg);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--card-border);
      }
      .nav-bar a {
        color: var(--cyan);
        text-decoration: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .nav-bar a:hover,
      .nav-bar a.active {
        background: rgba(56, 189, 248, 0.15);
        color: #fff;
      }

      h1 {
        color: var(--accent);
        margin-bottom: 15px;
      }

      pre {
        background: #000;
        padding: 15px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: monospace;
        color: #10b981;
        border: 1px solid var(--card-border);
      }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        background: var(--accent);
        color: #000;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a href="/">Admin</a>
      <a href="/scoreboard-simulator.html">Scoreboard Simulator</a>
      <a href="/serial-analyzer.html">Serial Port Analyzer</a>
      <a href="/ws-diag.html">WS Diag</a>
      <a href="/scoreboard-debug.html" class="active">Debug JSON</a>
    </nav>

    <h1>Scoreboard Debug endpoint</h1>
    <button onclick="fetchDebug()">Refresh JSON</button>

    <pre id="debug">Fetching debug state...</pre>

    <script>
      function fetchDebug() {
        fetch("/admin.json")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("debug").textContent = JSON.stringify(
              data,
              null,
              2,
            );
          })
          .catch((err) => {
            document.getElementById("debug").textContent =
              "Error fetching debug state: " + err;
          });
      }

      fetchDebug();
      setInterval(fetchDebug, 2000);
    </script>
  </body>
</html>
